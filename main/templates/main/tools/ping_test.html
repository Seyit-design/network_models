{% extends 'main/base.html' %}
{% block title %}Ping Test{% endblock %}
{% block content %}
<div class="container py-5">
    <div class="row">
        <div class="col-md-8 mx-auto">
            <div class="card">
                <div class="card-header bg-white">
                    <h1 class="h4 mb-0">Ping Test</h1>
                </div>
                <div class="card-body">
                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label">Host (IP ýa-da domen)</label>
                            <input type="text" name="host" class="form-control" placeholder="google.com ýa-da 8.8.8.8" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Ping iber</button>
                    </form>
                    
                    {% if result %}
                        <hr>
                        {% if result.error %}
                            <div class="alert alert-danger">{{ result.error }}</div>
                        {% else %}
                            <div class="alert {% if result.success %}alert-success{% else %}alert-warning{% endif %}">
                                <p><strong>Host:</strong> {{ result.host }}</p>
                                <pre>{{ result.output }}</pre>
                            </div>
                        {% endif %}
                    {% endif %}
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
