{% extends 'main/base.html' %}
{% block title %}IP Kalkulýator{% endblock %}
{% block content %}
<div class="container py-5">
    <div class="row">
        <div class="col-md-8 mx-auto">
            <div class="card">
                <div class="card-header bg-white">
                    <h1 class="h4 mb-0">IP Kalkulýator</h1>
                </div>
                <div class="card-body">
                    <form action="{% url 'ip_calculator_result' %}" method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label">IP Adres</label>
                            <input type="text" name="ip_address" class="form-control" placeholder="Mysal: 192.168.1.1" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Subnet Mask</label>
                            <select name="subnet_mask" class="form-select">
                                <option value="255.0.0.0">255.0.0.0 (/8) - Class A</option>
                                <option value="255.255.0.0">255.255.0.0 (/16) - Class B</option>
                                <option value="255.255.255.0" selected>255.255.255.0 (/24) - Class C</option>
                                <option value="255.255.255.128">255.255.255.128 (/25)</option>
                                <option value="255.255.255.192">255.255.255.192 (/26)</option>
                                <option value="255.255.255.224">255.255.255.224 (/27)</option>
                                <option value="255.255.255.240">255.255.255.240 (/28)</option>
                                <option value="255.255.255.248">255.255.255.248 (/29)</option>
                                <option value="255.255.255.252">255.255.255.252 (/30)</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Hasapla</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
