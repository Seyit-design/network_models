
name: Django Auto Deploy

on:
  push:
    branches:
      - main

jobs:
  connect:
    runs-on: ubuntu-latest

    steps:
      - name: Install sshpass
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass

      - name: Download Project
        env:
          SSHPASS: ${{ secrets.gizlin }}
        run: |
          sshpass -e ssh \
            -o StrictHostKeyChecking=accept-new \
            root@45.61.176.113 \
            '
              if [ -d "network_models/.git" ]; then
                cd network_models
                git pull origin main
              else
                git clone https://github.com/Seyit-design/network_models.git
              fi
            '
